serial_node:
  ros__parameters:
    port: /dev/ttyS1
    baudrate: 115200
    kv: 200.0
    kw: 100.0
    rpm_limit: 100
    left_direction: 1
    right_direction: 1
    send_hz: 50.0
    command_timeout: 0.3
    write_timeout: 0.01
    dry_run: false

keyboard_node:
  ros__parameters:
    linear_speed: 0.30
    angular_speed: 0.50
    linear_step: 0.05
    angular_step: 0.10
    max_linear: 0.80
    max_angular: 1.00
    publish_hz: 50.0
    stop_delay: 0.15
